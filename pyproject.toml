[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "environmental-sustainability-aqi-framework"
version = "0.2.0"
description = "Reproducible interim data-audit and explainable modeling framework for thermal generation, coal consumption, and air quality in selected Indian states."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Venkata Arun Srinivas Nibhanupudi"}]
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "matplotlib>=3.9,<4",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
  "statsmodels>=0.14,<1",
  "PyYAML>=6.0,<7",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
explain = ["shap>=0.46,<1"]
dev = ["pytest>=8,<10", "jupyter>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
